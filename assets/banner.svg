<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Mesh Glow Gradients -->
    <radialGradient id="glow-cyan" cx="25%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #334155; stroke-opacity: 0.18; stroke-width: 1; }
    .pulse-circle { animation: pulse 4s ease-in-out infinite alternate; }
    .data-flow-1 { stroke-dasharray: 8 12; animation: flow 20s linear infinite; }
    .data-flow-2 { stroke-dasharray: 6 10; animation: flow-reverse 24s linear infinite; }
    .floating-card { animation: float 6s ease-in-out infinite alternate; }
    .floating-card-2 { animation: float 7s ease-in-out infinite alternate-reverse; }
    .pill-pulse { animation: glow-pill 3s ease-in-out infinite alternate; }
    
    @keyframes flow {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flow-reverse {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 200; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.8; transform: scale(1.02); }
    }
    @keyframes glow-pill {
      0% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.4)); }
      100% { filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.8)); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Glows -->
  <rect width="1200" height="360" rx="16" fill="url(#glow-cyan)" />
  <rect width="1200" height="360" rx="16" fill="url(#glow-purple)" />

  <!-- Geometric Grid Pattern (Background Dynamic Effect) -->
  <g class="grid-layer">
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />

    <line x1="150" y1="0" x2="150" y2="360" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="360" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="360" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="360" class="grid-line" />
  </g>

  <!-- Dynamic Flow Lines in Background -->
  <g opacity="0.45">
    <path d="M 80,320 C 300,320 400,200 650,230 S 950,110 1140,80" fill="none" stroke="#38bdf8" stroke-width="2" class="data-flow-1" />
    <path d="M 50,70 C 320,120 480,40 720,100 S 1000,280 1150,290" fill="none" stroke="#a855f7" stroke-width="2" class="data-flow-2" />
    <path d="M 200,340 C 450,290 600,340 850,260 S 1080,180 1180,160" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 8" class="data-flow-1" />
  </g>

  <!-- Ambient Dynamic Floating Tech Icons/Cards in Background Perimeter (Kept away from center text) -->
  <g class="floating-card" opacity="0.85">
    <rect x="960" y="45" width="180" height="60" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="985" cy="75" r="12" fill="#38bdf8" fill-opacity="0.2" />
    <circle cx="985" cy="75" r="5" fill="#38bdf8" />
    <text x="1008" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Agent Harness</text>
    <text x="1008" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Runtime Orchestration</text>
  </g>

  <g class="floating-card-2" opacity="0.85">
    <rect x="960" y="240" width="180" height="60" rx="10" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="985" cy="270" r="12" fill="#818cf8" fill-opacity="0.2" />
    <circle cx="985" cy="270" r="5" fill="#818cf8" />
    <text x="1008" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Multi-Cloud IaC</text>
    <text x="1008" y="281" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">GitOps &amp; Drift Control</text>
  </g>

  <!-- Foreground Content: Header Badge -->
  <g class="pill-pulse" transform="translate(60, 48)">
    <rect width="250" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4" fill="#22c55e" />
    <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#c7d2fe" letter-spacing="0.5">CURATED AIOPS DIRECTORY</text>
  </g>

  <!-- Foreground Title (Crystal Clear & Prominent) -->
  <text x="60" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.5" filter="url(#shadow)">
    Awesome AI Operations Frameworks
  </text>

  <!-- Foreground Subtitle -->
  <text x="60" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#f1f5f9">
    Infrastructure Automation, Agent Harness Operations &amp; Deployment Orchestration
  </text>

  <!-- Secondary Description Line -->
  <text x="60" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
    Production-ready SaaS platforms &amp; high-performance open-source control planes for autonomous AI systems.
  </text>

  <!-- Category Pills along bottom of banner -->
  <g transform="translate(60, 275)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🤖 Agent Harness</text>

    <!-- Pill 2 -->
    <rect x="145" y="0" width="125" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="158" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#818cf8">⚡ Infrastructure IaC</text>

    <!-- Pill 3 -->
    <rect x="280" y="0" width="115" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="294" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c084fc">☸️ Kubernetes &amp; CD</text>

    <!-- Pill 4 -->
    <rect x="405" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="419" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">📈 Observability &amp; Cost</text>
  </g>
</svg>
